name: Ingest exact Limbora final 002A playtest build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingest-playtest.yml'

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYTEST_ZIP_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-a510-81f7-846e-ac6a9a089878/raw?se=2026-09-27T08%3A13%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=472bfc60-49bb-5c05-b6e3-3cc1ec7aa793&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T02%3A00%3A36Z&ske=2026-09-28T02%3A00%3A36Z&sks=b&skv=2026-02-06&sig=uQPxLx%2BHWqTzo6st4SBbAaOxXiC0LC9zBNwrqERryEw%3D'
      EXPECTED_SOURCE_SHA: '9f0baea3484446b181924bf4927599c84eb58854'
    steps:
      - name: Download compiled artifact
        run: |
          curl -L --fail --retry 3 "$PLAYTEST_ZIP_URL" -o playtest.zip
          mkdir site
          unzip -q playtest.zip -d site

      - name: Verify deploy-only contents
        run: |
          test -f site/index.html
          test -f site/BUILD.json
          test -f site/manifest.webmanifest
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync('site/BUILD.json', 'utf8'));
          const expected = process.env.EXPECTED_SOURCE_SHA;
          if (receipt.sourceSha !== expected) {
            throw new Error(`Wrong source SHA: ${receipt.sourceSha} !== ${expected}`);
          }
          if (receipt.sourceRepo !== 'dontaedct/limbora-game-lab') {
            throw new Error('Unexpected source repository');
          }
          NODE
          if find site -type f -name '*.map' | grep -q .; then
            echo "Refusing to publish source maps" >&2
            exit 1
          fi
          for forbidden in src tests docs tools .env package.json package-lock.json tsconfig.json; do
            if [ -e "site/$forbidden" ]; then
              echo "Refusing unexpected source/development content: $forbidden" >&2
              exit 1
            fi
          done
          find site -maxdepth 3 -type f -printf '%P %s bytes\n' | sort

      - name: Store verified public-deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: limbora-playtest-9f0baea
          path: site/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
